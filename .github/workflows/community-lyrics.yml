# Tourne'Table community lyrics animations: reads a "Lyrics: ..." issue and answers with what it found, adds it to
# community/lyrics when a maintainer labels the issue "approved", and checks the folder on every push. The issue text
# is only ever read by lyrics.py from the event file, never put into a shell command.
name: Community lyrics

on:
  issues:
    types: [opened, edited, labeled]
  push:
    branches: [main]
    paths: ["community/lyrics/**", "community/tools/lyrics.py"]
  pull_request:
    paths: ["community/lyrics/**"]

permissions:
  contents: write
  issues: write

concurrency:
  group: community-styles
  cancel-in-progress: false

jobs:
  read-issue:
    if: github.event_name == 'issues' && github.event.action != 'labeled' && startsWith(github.event.issue.title, 'Lyrics:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the animation in the issue
        run: python3 community/tools/lyrics.py issue "$RUNNER_TEMP/result.json"
      - name: Answer
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const r = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/result.json', 'utf8'));
            const issue_number = context.issue.number;
            await github.rest.issues.createComment({ ...context.repo, issue_number, body: r.comment });
            try {
              await github.rest.issues.addLabels({ ...context.repo, issue_number, labels: ['community-lyrics'] });
            } catch (e) { core.info('label: ' + e.message); }

  add-animation:
    if: >-
      github.event_name == 'issues' && github.event.action == 'labeled' &&
      github.event.label.name == 'approved' && startsWith(github.event.issue.title, 'Lyrics:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add the animation
        run: python3 community/tools/lyrics.py add "$RUNNER_TEMP/result.json"
      - name: Commit
        run: |
          git config user.name "tourne-community-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add community/lyrics
          if git diff --cached --quiet; then echo "nothing to add"; exit 0; fi
          git commit -m "Community: add a lyrics animation from #${{ github.event.issue.number }}"
          git push
      - name: Answer and close
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const r = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/result.json', 'utf8'));
            const issue_number = context.issue.number;
            await github.rest.issues.createComment({ ...context.repo, issue_number, body: r.comment });
            if (r.ok) await github.rest.issues.update({ ...context.repo, issue_number, state: 'closed' });

  check:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every animation
        run: python3 community/tools/lyrics.py check
