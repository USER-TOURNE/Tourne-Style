# Tourne menus: what each menu shows. Copy this to %APPDATA%\Tourne\Desktop\menus.conf and take the # off
# the lines you want. It's read again whenever it changes; menus.log beside it says which lines didn't make sense.
#
# Lines:
#   hide LABEL                 left out (a label, any case, or a verb: properties, openas, cut)
#   hide Paste (greyed)        only while it's greyed out
#   more LABEL                 moved into "More options" at the end
#   more-label NAME            what that submenu is called
#   rename OLD -> NEW
#   add LABEL = COMMAND        a new item at the end; "add top" puts it first; "add separator" a line
#
# Sections say which menus the lines under them are for; every condition must hold, ! turns one round:
#   [when menu desktop, files *.txt *.md]
#   [all]                      back to every menu
# Conditions: menu (desktop, taskbar, explorer, dialog, windows), app NAME.exe, files PATTERN..., folder,
# background (the empty space), shift. Explorer's menus don't say what's chosen, so files, folder and
# background never hold there.
# In commands: %file% (the first chosen, quoted), %files% (all), %folder% (where it opened), %VARIABLES%.

# hide Cast to Device
# more Give access to
# rename Copy as path -> Copy path

# [when menu desktop, background]
# add Terminal here = wt.exe -d %folder%

# [when menu desktop, files *.txt *.md *.json]
# add top Edit in Notepad = notepad.exe %file%
