# Tourne binds, written as Hyprland's. A starting set to try: copy it to
# %APPDATA%\Tourne\binds.conf and set Studio > Switcher > Key binds and control >
# Binds file to that path (and turn Key binds on).
# Every key below is taken by Tourne while it runs: the program in front never
# hears it. All use WIN+ALT so everyday shortcuts are left alone. Change freely.

$mod = WIN ALT

# Windows
bind = $mod, Q, killactive
bind = $mod, F, togglefloating
bind = $mod, M, fullscreen
bind = $mod, P, pin
bind = $mod, C, centerwindow

# Focus and move (h j k l, or the arrows)
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

# Windows' desktops
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
# (a desktop that isn't there yet is made)

# Mouse: hold WIN+ALT and drag with the left button to move, the right to resize
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Tiling
bind = $mod, N, layoutmsg, cycle
bind = $mod, T, layoutmsg, tile
binde = $mod, bracketleft, splitratio, -0.05
binde = $mod, bracketright, splitratio, 0.05

# Groups (tabs)
bind = $mod, G, togglegroup
bind = $mod, tab, changegroupactive, f
bind = $mod SHIFT, G, moveoutofgroup

# Scratchpad
bind = $mod, S, togglespecialworkspace
bind = $mod SHIFT, S, movetoworkspace, special

# Tools
bind = $mod, O, overview
bind = $mod, X, pickcolor
bind = $mod, return, exec, [float; size 60% 60%; center] wt

# Resize mode: WIN+ALT+R, then the arrows; Escape leaves
bind = $mod, R, submap, resize
submap = resize
binde = , right, resizeactive, 40 0
binde = , left, resizeactive, -40 0
binde = , down, resizeactive, 0 40
binde = , up, resizeactive, 0 -40
bind = , escape, submap, reset
submap = reset

# Rules for windows as they open
windowrule = float, center, title:Calculator
windowrule = size 40% 40%, title:Picture-in-Picture

# Away: screens off after 10 minutes, lock after 20
idle = 600, dpms, off
idle = 1200, lockscreen
